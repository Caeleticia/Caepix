<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CaePixiv</title>
<style>
  :root{
    --bg:#f2ebe4;
    --card:#ffffff;
    --ink:#3d342c;
    --muted:#8b7f74;
    --accent:#b06a4a;
    --accent-dark:#8f533a;
    --line:#e3d9ce;
    --err:#c0503f;
    --ok:#5b8c5a;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .hero{
    max-width:1680px; margin:0 auto;
    padding:26px 20px 0;
    display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
  }
  .hero h1{
    margin:0; font-size:23px; line-height:1.25; font-weight:700;
    letter-spacing:.01em; color:var(--accent-dark);
  }
  .hero h1 .dot{
    display:inline-block; width:9px; height:9px; border-radius:50%;
    background:var(--accent); margin-right:10px; vertical-align:2px;
  }
  .hero .sub{
    margin:0; font-size:12.5px; color:var(--muted); letter-spacing:.02em;
  }

  .hero-notice{
    max-width:1680px;
    margin:6px auto 0;
    padding:0 20px;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    color:var(--muted);
    font-size:12.5px;
    letter-spacing:.02em;
  }
  .hero-notice .sep{
    flex:1;
    min-width:24px;
    height:1px;
    background:var(--line);
  }
  .hero-notice .notice-text{
    color:var(--muted);
    letter-spacing:.02em;
  }

  header{
    position:sticky; top:0; z-index:10;
    background:rgba(242,235,228,.95);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:14px 20px 12px;
  }
  .toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end;}
  .field{display:flex; flex-direction:column; gap:4px}
  .field label{font-size:11px; letter-spacing:.06em; color:var(--muted)}
  input, select{
    background:#fff; border:1px solid var(--line); border-radius:9px;
    padding:8px 11px; font:inherit; color:inherit;
    width:170px; outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  select{cursor:pointer; padding-right:26px;}
  .field.small input{width:84px}
  input:focus, select:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(176,106,74,.13);
  }
  button{
    border:1px solid var(--line); background:#fff; color:var(--ink);
    padding:9px 16px; border-radius:9px; font:inherit; cursor:pointer;
    transition:background .15s,border-color .15s,color .15s,transform .1s;
  }
  button:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:.42; cursor:not-allowed}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  button.primary:hover:not(:disabled){background:var(--accent-dark); border-color:var(--accent-dark); color:#fff}

  .collapsible-box{
    margin-top:12px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#fff;
    overflow:hidden;
  }
  .collapsible-box .box-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:8px 14px;
    background:#faf6f1;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    user-select:none;
  }
  .collapsible-box .box-head .box-title{
    font-size:12px;
    color:var(--muted);
    letter-spacing:.06em;
    font-weight:600;
  }
  .collapsible-box .box-head .box-toggle{
    font-size:12px;
    color:var(--accent);
    border:1px solid var(--line);
    border-radius:7px;
    padding:2px 10px;
    background:#fff;
    transition:color .15s,border-color .15s;
  }
  .collapsible-box .box-head:hover .box-toggle{
    color:var(--accent-dark);
    border-color:var(--accent);
  }
  .collapsible-box .box-body{
    padding:12px 14px 14px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:flex-end;
  }
  .collapsible-box.collapsed .box-body{
    display:none;
  }

  .statusbar{
    margin-top:11px; display:flex; align-items:center; gap:10px;
    font-size:12px; color:var(--muted);
  }
  .progress{
    flex:0 1 320px; min-width:120px; height:6px; background:#e5dad0;
    border-radius:99px; overflow:hidden;
  }
  .bar{
    height:100%; width:0; background:var(--accent);
    border-radius:99px; transition:width .2s ease;
  }
  .pct{
    font-variant-numeric:tabular-nums; color:var(--accent);
    font-weight:600; min-width:38px; text-align:right;
  }
  #status{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

  .stats{
    margin-top:10px; display:flex; flex-wrap:wrap; gap:6px;
  }
  .stat{
    display:flex; align-items:center; gap:5px;
    background:#fff; border:1px solid var(--line); border-radius:8px;
    padding:3px 9px; font-size:12px; line-height:1.7;
  }
  .stat .k{color:var(--muted)}
  .stat .v{font-weight:600; font-variant-numeric:tabular-nums}
  .stat .v.ok{color:var(--ok)}
  .stat .v.err{color:var(--err)}
  .stat.wide{flex:1; min-width:180px}
  .stat.wide .v{
    font-weight:500; color:var(--accent);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  main{max-width:1680px; margin:0 auto; padding:20px}
  #grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(168px, 1fr));
    gap:14px;
  }
  .empty{text-align:center; color:var(--muted); padding:70px 20px}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    overflow:hidden; display:flex; flex-direction:column;
    box-shadow:0 1px 2px rgba(61,52,44,.045);
    animation:fade .25s ease;
  }
  @keyframes fade{from{opacity:0; transform:translateY(4px)}to{opacity:1;transform:none}}

  .thumb{
    position:relative; aspect-ratio:3/4; background:#eae1d7;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .thumb.clickable{cursor:zoom-in}
  .thumb img{
    width:100%; height:100%; object-fit:contain; display:block;
    opacity:0; transition:opacity .3s ease;
  }
  .thumb img.ready{opacity:1}
  .placeholder{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:20px;
  }
  .spinner{
    width:22px; height:22px; display:block; border-radius:50%;
    border:2px solid #d9cec2; border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .placeholder.err{
    flex-direction:column; gap:6px; padding:8px 12px; text-align:center;
    justify-content:center;
  }
  .placeholder.err .x-mark{
    font-size:44px; line-height:1; font-weight:300;
    color:var(--err);
    opacity:.85;
    user-select:none;
  }
  .placeholder.err .x-text{
    font-size:12px; line-height:1.35; color:#a8807a;
  }
  .card.failed .thumb{background:#faf0ed; cursor:pointer}
  .card .zoom-hint{
    position:absolute; right:6px; bottom:6px;
    background:rgba(61,52,44,.62); color:#fff;
    font-size:11px; padding:2px 7px; border-radius:99px;
    opacity:0; transition:opacity .18s ease; pointer-events:none;
  }
  .thumb.clickable:hover .zoom-hint{opacity:1}
  .card.failed .thumb:hover .zoom-hint{opacity:1}
  .card.failed .zoom-hint{background:rgba(192,80,63,.85)}

  .card-footer{
    display:flex; align-items:center; justify-content:space-between;
    padding:7px 9px; border-top:1px solid var(--line); font-size:12px;
    gap:6px;
  }
  .card-footer .num{
    color:var(--muted); font-variant-numeric:tabular-nums;
    letter-spacing:.02em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .card-footer .save{padding:4px 11px; font-size:12px; border-radius:7px; flex:none}

  .lightbox{
    position:fixed; inset:0; z-index:100;
    background:rgba(22,18,15,.94);
    animation:fade .18s ease;
  }
  .lb-stage{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    padding:66px 76px 84px;
  }
  .lb-stage img{
    max-width:100%; max-height:100%; object-fit:contain;
    border-radius:4px; box-shadow:0 16px 56px rgba(0,0,0,.55);
    background:#1a1512;
  }
  .lb-btn{
    position:absolute; z-index:2;
    background:rgba(255,255,255,.1); color:#fff;
    border:1px solid rgba(255,255,255,.22);
    border-radius:50%; width:44px; height:44px; padding:0;
    font-size:24px; line-height:1; display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:background .15s, border-color .15s;
    backdrop-filter:blur(4px);
  }
  .lb-btn:hover:not(:disabled){background:rgba(255,255,255,.24); border-color:rgba(255,255,255,.5); color:#fff}
  .lb-btn:disabled{opacity:.22; cursor:not-allowed}
  .lb-close{top:16px; right:16px; font-size:26px}
  .lb-prev{left:16px; top:50%; transform:translateY(-50%)}
  .lb-next{right:16px; top:50%; transform:translateY(-50%)}

  .lb-bar{
    position:absolute; left:0; right:0; bottom:0; z-index:2;
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:14px 22px;
    background:linear-gradient(to top, rgba(0,0,0,.6), transparent);
    color:#fff; font-size:13px;
  }
  .lb-meta{display:flex; align-items:center; gap:14px; min-width:0}
  .lb-counter{
    font-variant-numeric:tabular-nums; color:rgba(255,255,255,.65);
    flex:none;
  }
  .lb-caption{
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .lb-bar button{
    background:rgba(255,255,255,.14); color:#fff;
    border:1px solid rgba(255,255,255,.28); border-radius:8px;
    padding:7px 16px; font-size:13px; flex:none;
  }
  .lb-bar button:hover:not(:disabled){
    background:rgba(255,255,255,.26); border-color:rgba(255,255,255,.55); color:#fff;
  }

  .site-footer{
    max-width:1680px; margin:0 auto;
    padding:8px 20px 34px;
    color:var(--muted); font-size:12px;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .site-footer .sep{
    flex:1; min-width:24px; height:1px; background:var(--line);
  }
  .site-footer a{
    color:var(--accent); text-decoration:none;
    border-bottom:1px solid rgba(176,106,74,.35);
    transition:border-color .15s, color .15s;
  }
  .site-footer a:hover{color:var(--accent-dark); border-bottom-color:var(--accent-dark)}

  .log-section{
    max-width:1680px; margin:0 auto 20px; padding:0 20px;
  }
  .log-header{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:8px; flex-wrap:wrap; gap:8px;
  }
  .log-header h2{
    font-size:15px; margin:0; color:var(--accent-dark);
  }
  .log-actions button{
    padding:4px 12px; font-size:12px; margin-left:6px;
  }
  .log-list{
    background:#fff; border:1px solid var(--line); border-radius:10px;
    max-height:320px; overflow-y:auto;
    font-size:12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    padding:8px;
  }
  .log-entry{
    border-bottom:1px solid var(--line);
    padding:6px 4px;
    word-break:break-all;
  }
  .log-entry:last-child{border-bottom:none}
  .log-time{color:var(--muted); margin-right:8px}
  .log-level{font-weight:700; margin-right:6px}
  .log-level.error{color:var(--err)}
  .log-level.info{color:var(--ok)}
  .log-url{color:var(--accent)}
  .log-detail{
    margin-top:4px; color:#555; white-space:pre-wrap;
    max-height:140px; overflow-y:auto;
    background:#f9f5f2; padding:4px 6px; border-radius:4px;
    font-size:11.5px;
  }
  .log-section.collapsed .log-list{display:none}
  .log-empty{color:var(--muted); padding:8px; text-align:center}

  #packAll {
    background: var(--accent-dark);
    border-color: var(--accent-dark);
    color: #fff;
    font-weight: 500;
  }
  #packAll:hover:not(:disabled) {
    background: #7a452f;
    border-color: #7a452f;
    color: #fff;
  }

  @media (max-width:640px){
    .hero{padding:16px 14px 0; gap:6px}
    .hero h1{font-size:18px}
    .hero h1 .dot{width:8px; height:8px; margin-right:7px}
    .hero .sub{font-size:11.5px}
    .hero-notice{padding:0 14px; font-size:11.5px}
    header{padding:12px 14px 10px}
    main{padding:14px}
    input, select{width:130px}
    .field.small input{width:72px}
    #grid{grid-template-columns:repeat(auto-fill, minmax(132px,1fr)); gap:10px}
    .lb-stage{padding:60px 14px 88px}
    .lb-prev{left:8px} .lb-next{right:8px}
    .lb-btn{width:38px; height:38px; font-size:21px}
    #status{font-size:11px}
    .site-footer{padding:6px 14px 26px; font-size:11.5px}
    .log-section{padding:0 14px}
    .collapsible-box .box-body{padding:10px 10px 12px}
  }
</style>
</head>
<body>

<div class="hero">
  <h1><span class="dot"></span>CaePixiv</h1>
  <p class="sub">基于镜像源Pixiv的图片批量下载器</p>
</div>

<div class="hero-notice">
  <span class="notice-text">仅供个人学习交流，请勿下载违规图片</span>
  <span class="sep"></span>
  <span class="notice-text">由于获取的图片都暂时存在内存中，请尽量减少单次下载图片数量，否则可能导致页面卡死</span>
</div>

<header>
  <div class="toolbar">
    <div class="field">
      <label for="source">图片来源</label>
      <select id="source">
        <optgroup label="主站镜像">
          <option value="https://pixiv.cat/{pid}-{page}.png">pixiv.cat</option>
          <option value="https://pixiv.re/{pid}-{page}.png" selected>pixiv.re</option>
          <option value="https://pixiv.nl/{pid}-{page}.png">pixiv.nl</option>
        </optgroup>
        <optgroup label="反向代理">
          <option value="https://i.pixiv.re/{pid}-{page}.png">i.pixiv.re（反向代理）</option>
          <option value="https://i.pixiv.nl/{pid}-{page}.png">i.pixiv.nl（反向代理）</option>
          <option value="https://i.pixiv.cat/{pid}-{page}.png">i.pixiv.cat（反向代理）</option>
        </optgroup>
      </select>
    </div>
    <div class="field">
      <label for="pid">作品pid</label>
      <input id="pid" type="text" inputmode="numeric" spellcheck="false" value="150450134">
    </div>
    <div class="field small">
      <label for="start">起始页</label>
      <input id="start" type="number" min="1" value="1">
    </div>
    <div class="field small">
      <label for="end">结束页</label>
      <input id="end" type="number" min="1" value="27">
    </div>
    <button id="load" class="primary">获取图片</button>
    <button id="saveAll" disabled>全部保存</button>
    <button id="packAll" disabled>下载为ZIP</button>
    <button id="clear">清空并释放内存</button>
  </div>

  <div class="collapsible-box" id="paramBox">
    <div class="box-head" id="paramToggle">
      <span class="box-title">高级参数设置</span>
      <span class="box-toggle" id="paramToggleText">折叠 ▲</span>
    </div>
    <div class="box-body">
      <div class="field small">
        <label for="conc">并发数</label>
        <input id="conc" type="number" min="1" max="10" step="1" value="2">
      </div>
      <div class="field">
        <label for="intervalMode">请求间隔</label>
        <select id="intervalMode">
          <option value="none">无间隔</option>
          <option value="fixed">固定</option>
          <option value="random" selected>随机</option>
        </select>
      </div>
      <div class="field small" id="intervalFixedField" hidden>
        <label for="intervalFixed">间隔(ms)</label>
        <input id="intervalFixed" type="number" min="0" max="60000" step="50" value="1000">
      </div>
      <div class="field small" id="intervalMinField">
        <label for="intervalMin">最小(ms)</label>
        <input id="intervalMin" type="number" min="0" max="60000" step="50" value="800">
      </div>
      <div class="field small" id="intervalMaxField">
        <label for="intervalMax">最大(ms)</label>
        <input id="intervalMax" type="number" min="0" max="60000" step="50" value="1800">
      </div>
      <div class="field small">
        <label for="timeout">超时(秒)</label>
        <input id="timeout" type="number" min="0" step="1" value="0">
      </div>
    </div>
  </div>

  <div class="statusbar">
    <div class="progress"><div class="bar" id="bar"></div></div>
    <span class="pct" id="pct">0%</span>
    <span id="status">就绪 · 输入 PID 与页码范围后点击「获取图片」</span>
  </div>

  <div class="stats">
    <div class="stat"><span class="k">总数</span><b class="v" id="sTotal">—</b></div>
    <div class="stat"><span class="k">已完成</span><b class="v" id="sDone">0</b></div>
    <div class="stat"><span class="k">成功</span><b class="v ok" id="sOk">0</b></div>
    <div class="stat"><span class="k">失败</span><b class="v err" id="sFail">0</b></div>
    <div class="stat"><span class="k">进行中</span><b class="v" id="sActive">0</b></div>
    <div class="stat"><span class="k">排队</span><b class="v" id="sQueue">0</b></div>
    <div class="stat"><span class="k">内存</span><b class="v" id="sSize">0 B</b></div>
    <div class="stat"><span class="k">耗时</span><b class="v" id="sTime">0.0s</b></div>
    <div class="stat wide"><span class="k">当前请求</span><b class="v" id="sPages">—</b></div>
  </div>
</header>

<main>
  <div id="grid"></div>
  <div id="empty" class="empty">输入 PID 与页码范围，点击「获取图片」开始</div>
</main>

<section id="logSection" class="log-section">
  <div class="log-header">
    <h2>请求日志 · 原始网页内容记录</h2>
    <div class="log-actions">
      <button id="logToggle">折叠</button>
      <button id="logCopy">复制日志</button>
      <button id="logClear">清空</button>
    </div>
  </div>
  <div id="logList" class="log-list">
    <div class="log-empty">暂无日志</div>
  </div>
</section>

<footer class="site-footer">
  <span>使用的工具：<a href="https://pixiv.re" target="_blank" rel="noopener noreferrer">https://pixiv.re</a></span>
  <span class="sep"></span>
  <span>
    本页面由Bilibili<a href="https://space.bilibili.com/3494377901001494" target="_blank" rel="noopener noreferrer">@可莱缇西娅</a>开发
  </span>
  <span class="sep"></span>
  <span>CaePixiv · 仅供个人学习与备份使用</span>
</footer>

<div class="lightbox" id="lightbox" hidden>
  <button class="lb-btn lb-close" id="lbClose" title="关闭 (Esc)">×</button>
  <button class="lb-btn lb-prev" id="lbPrev" title="上一张 (←)">‹</button>
  <button class="lb-btn lb-next" id="lbNext" title="下一张 (→)">›</button>

  <div class="lb-stage" id="lbStage">
    <img id="lbImg" alt="">
  </div>

  <div class="lb-bar">
    <div class="lb-meta">
      <span class="lb-counter" id="lbCounter">—</span>
      <span class="lb-caption" id="lbCaption">—</span>
    </div>
    <button id="lbSave">保存这张</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function () {
  'use strict';

  /* ============ 配置 ============ */
  const MAX_CONCURRENCY = 10;
  const MAX_PAGES       = 300;
  const MAX_INTERVAL_MS = 60000;
  const ERR_TEXT_MAX    = 160;
  const MAX_LOGS        = 200;
  const LOG_DETAIL_MAX  = 3000;

  /* ============ 元素 ============ */
  const els = {
    source:          document.getElementById('source'),
    pid:             document.getElementById('pid'),
    start:           document.getElementById('start'),
    end:             document.getElementById('end'),
    conc:            document.getElementById('conc'),
    intervalMode:    document.getElementById('intervalMode'),
    intervalFixed:   document.getElementById('intervalFixed'),
    intervalMin:     document.getElementById('intervalMin'),
    intervalMax:     document.getElementById('intervalMax'),
    intervalFixedField: document.getElementById('intervalFixedField'),
    intervalMinField:   document.getElementById('intervalMinField'),
    intervalMaxField:   document.getElementById('intervalMaxField'),
    timeout:         document.getElementById('timeout'),
    load:            document.getElementById('load'),
    saveAll:         document.getElementById('saveAll'),
    packAll:         document.getElementById('packAll'),
    clear:           document.getElementById('clear'),
    grid:            document.getElementById('grid'),
    empty:           document.getElementById('empty'),
    status:          document.getElementById('status'),
    bar:             document.getElementById('bar'),
    pct:             document.getElementById('pct'),
    sTotal:          document.getElementById('sTotal'),
    sDone:           document.getElementById('sDone'),
    sOk:             document.getElementById('sOk'),
    sFail:           document.getElementById('sFail'),
    sActive:         document.getElementById('sActive'),
    sQueue:          document.getElementById('sQueue'),
    sSize:           document.getElementById('sSize'),
    sTime:           document.getElementById('sTime'),
    sPages:          document.getElementById('sPages'),
    lb:              document.getElementById('lightbox'),
    lbImg:           document.getElementById('lbImg'),
    lbStage:         document.getElementById('lbStage'),
    lbClose:         document.getElementById('lbClose'),
    lbPrev:          document.getElementById('lbPrev'),
    lbNext:          document.getElementById('lbNext'),
    lbSave:          document.getElementById('lbSave'),
    lbCounter:       document.getElementById('lbCounter'),
    lbCaption:       document.getElementById('lbCaption'),
    logSection:      document.getElementById('logSection'),
    logList:         document.getElementById('logList'),
    logToggle:       document.getElementById('logToggle'),
    logCopy:         document.getElementById('logCopy'),
    logClear:        document.getElementById('logClear'),
    paramBox:        document.getElementById('paramBox'),
    paramToggle:     document.getElementById('paramToggle'),
    paramToggleText: document.getElementById('paramToggleText')
  };

  /* ============ 状态 ============ */
  let session  = null;
  let runToken = 0;
  let saving   = false;
  let packing  = false;
  let timerId  = null;
  let lbList   = [];
  let lbIndex  = 0;
  let logEntries = [];

  let stats = newStats();
  function newStats() {
    return {
      total: 0, done: 0, ok: 0, fail: 0,
      active: 0, queue: 0, bytes: 0,
      startTime: 0, activePages: new Set()
    };
  }

  /* ============ 小工具 ============ */
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const setStatus = t => { els.status.textContent = t; };
  const buildUrl = (pid, page, tmpl) =>
    tmpl.replace('{pid}', pid).replace('{page}', page);

  function buildUrlCandidates(pid, page, tmpl) {
    if (page === 1) {
      const noSuffix = tmpl
        .replace('{pid}', pid)
        .replace('-{page}', '')
        .replace('{page}', '');
      const withSuffix = buildUrl(pid, page, tmpl);
      if (noSuffix === withSuffix) return [withSuffix];
      return [noSuffix, withSuffix];
    }
    return [buildUrl(pid, page, tmpl)];
  }

  function formatSize(n) {
    if (!n || n <= 0) return '0 B';
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1048576).toFixed(2) + ' MB';
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function extFromBlobType(type) {
    if (!type) return 'png';
    if (type.includes('jpeg') || type.includes('jpg')) return 'jpg';
    if (type.includes('png')) return 'png';
    if (type.includes('gif')) return 'gif';
    if (type.includes('webp')) return 'webp';
    if (type.includes('bmp')) return 'bmp';
    return 'png';
  }

  /* ============ 日志 ============ */
  function addLog(level, url, status, detail) {
    const entry = {
      time: new Date().toLocaleTimeString(),
      level,
      url: url || '',
      status: status || '',
      detail: detail ? String(detail).slice(0, LOG_DETAIL_MAX) : ''
    };
    logEntries.unshift(entry);
    if (logEntries.length > MAX_LOGS) logEntries.pop();
    renderLogs();
  }

  function renderLogs() {
    if (!els.logList) return;
    if (!logEntries.length) {
      els.logList.innerHTML = '<div class="log-empty">暂无日志</div>';
      return;
    }
    els.logList.innerHTML = logEntries.map(e => `
      <div class="log-entry">
        <span class="log-time">${escapeHtml(e.time)}</span>
        <span class="log-level ${e.level}">${e.level === 'error' ? '错误' : '信息'}</span>
        <span class="log-url">${escapeHtml(e.url)}</span>
        ${e.status ? `<span> · ${escapeHtml(e.status)}</span>` : ''}
        ${e.detail ? `<div class="log-detail">${escapeHtml(e.detail)}</div>` : ''}
      </div>
    `).join('');
  }

  els.logToggle.addEventListener('click', () => {
    els.logSection.classList.toggle('collapsed');
    els.logToggle.textContent = els.logSection.classList.contains('collapsed') ? '展开' : '折叠';
  });

  els.logClear.addEventListener('click', () => {
    logEntries = [];
    renderLogs();
    setStatus('日志已清空');
  });

  els.logCopy.addEventListener('click', () => {
    const text = logEntries.map(e =>
      `[${e.time}] [${e.level}] ${e.url} ${e.status}\n${e.detail}`
    ).join('\n\n');
    if (!text) { setStatus('没有日志可复制'); return; }
    navigator.clipboard.writeText(text).then(() => {
      setStatus('日志已复制到剪贴板');
    }).catch(() => {
      setStatus('复制失败，请手动选择复制');
    });
  });

  function errTag(kind) {
    if (kind === 'timeout')   return '超时';
    if (kind === 'notfound')  return '404';
    if (kind === 'forbidden') return '403';
    if (kind === 'network')   return '无响应';
    if (kind === 'htmlpage')  return '网页';
    if (kind === 'notimage')  return '非图片';
    if (kind && kind.startsWith('http:')) return 'HTTP ' + kind.slice(5);
    return '失败';
  }

  function roughText(raw) {
    if (!raw) return '';
    const s = String(raw).trim();
    if (!s) return '';
    if (/<\s*[a-z!/]/i.test(s)) {
      try {
        const doc = new DOMParser().parseFromString(s, 'text/html');
        const body = doc.body;
        if (body) {
          const t = (body.textContent || '').replace(/\s+/g, ' ').trim();
          if (t) return t.slice(0, ERR_TEXT_MAX);
        }
      } catch (e) { }
    }
    return s.replace(/\s+/g, ' ').slice(0, ERR_TEXT_MAX);
  }

  /* ============ 间隔控制 ============ */
  function updateIntervalUI() {
    const mode = els.intervalMode.value;
    els.intervalFixedField.hidden = mode !== 'fixed';
    els.intervalMinField.hidden   = mode !== 'random';
    els.intervalMaxField.hidden   = mode !== 'random';
  }

  function getIntervalMs() {
    const mode = els.intervalMode.value;
    if (mode === 'none') return 0;

    if (mode === 'fixed') {
      const v = parseInt(els.intervalFixed.value, 10);
      return Number.isFinite(v) && v > 0 ? Math.min(v, MAX_INTERVAL_MS) : 0;
    }

    const loRaw = parseInt(els.intervalMin.value, 10);
    const hiRaw = parseInt(els.intervalMax.value, 10);
    const lo = Number.isFinite(loRaw) && loRaw > 0 ? Math.min(loRaw, MAX_INTERVAL_MS) : 0;
    const hi = Number.isFinite(hiRaw) && hiRaw > 0 ? Math.min(hiRaw, MAX_INTERVAL_MS) : lo;
    if (hi <= lo) return lo;
    return lo + Math.random() * (hi - lo);
  }

  function describeInterval() {
    const mode = els.intervalMode.value;
    if (mode === 'none') return '无间隔';
    if (mode === 'fixed') {
      const v = parseInt(els.intervalFixed.value, 10) || 0;
      return v > 0 ? '固定 ' + v + 'ms' : '无间隔';
    }
    const lo = parseInt(els.intervalMin.value, 10) || 0;
    const hi = parseInt(els.intervalMax.value, 10) || 0;
    if (lo === 0 && hi === 0) return '无间隔';
    return '随机 ' + lo + '–' + hi + 'ms';
  }

  /* ============ 统计渲染 ============ */
  function renderStats() {
    els.sTotal.textContent  = stats.total || '—';
    els.sDone.textContent   = stats.done;
    els.sOk.textContent     = stats.ok;
    els.sFail.textContent   = stats.fail;
    els.sActive.textContent = stats.active;
    els.sQueue.textContent  = stats.queue;
    els.sSize.textContent   = formatSize(stats.bytes);

    const pages = Array.from(stats.activePages).sort((a, b) => a - b);
    els.sPages.textContent = pages.length ? pages.map(p => 'P' + p).join('、') : '—';

    const pct = stats.total ? stats.done / stats.total : 0;
    els.bar.style.width = (pct * 100).toFixed(1) + '%';
    els.pct.textContent = (pct * 100).toFixed(0) + '%';
  }

  function resetStats() {
    stats = newStats();
    stopTimer();
    els.sTime.textContent = '0.0s';
    renderStats();
  }

  function startTimer() {
    stopTimer();
    stats.startTime = Date.now();
    timerId = setInterval(() => {
      if (!stats.startTime) return;
      els.sTime.textContent = ((Date.now() - stats.startTime) / 1000).toFixed(1) + 's';
    }, 100);
  }
  function stopTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
  }
  function freezeTimer() {
    stopTimer();
    if (stats.startTime) {
      els.sTime.textContent = ((Date.now() - stats.startTime) / 1000).toFixed(1) + 's';
    }
  }

  function updateSaveAllState() {
    if (saving || packing) {
      els.saveAll.disabled = true;
      els.packAll.disabled = true;
      return;
    }
    const list = (session ? session.items : [])
      .filter(i => i.result && !i.result.failed);
    const hasAny  = list.length > 0;
    const hasBlob = list.some(i => i.result.blob);
    els.saveAll.disabled = !hasAny;
    els.packAll.disabled = !hasBlob;
  }

  /* ============ 卡片 ============ */
  function createCard(page) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="thumb">' +
        '<div class="placeholder"><span class="spinner"></span></div>' +
        '<img alt="P' + page + '" decoding="async">' +
        '<span class="zoom-hint">点击放大</span>' +
      '</div>' +
      '<div class="card-footer">' +
        '<span class="num">P' + page + '</span>' +
        '<button type="button" class="save" disabled>保存</button>' +
      '</div>';

    card.querySelector('.thumb').addEventListener('click', () => {
      const it = card._item;
      if (!it) return;
      if (it.result && it.result.failed) { retryItem(it); return; }
      if (!it.result) return;
      openLightbox(it);
    });

    card.querySelector('.save').addEventListener('click', () => {
      const it = card._item;
      if (it && it.result && !it.result.failed) triggerDownload(it.result);
    });

    return card;
  }

  function triggerDownload(result) {
    if (!result || result.failed) return;

    // 预览模式（无 CORS 头）：打开原图，让用户手动另存
    if (result.imgOnly) {
      window.open(result.url, '_blank', 'noopener');
      setStatus('P' + result.page +
        ' 为预览模式（服务器未返回 CORS 头），已打开原图，请手动右键另存');
      return;
    }

    if (!result.blob) return;
    const pid  = session ? session.pid : 'pixiv';
    const ext  = extFromBlobType(result.blob.type);
    const name = pid + '-' + result.page + '.' + ext;
    const a = document.createElement('a');
    a.href = result.objectUrl;
    a.download = name;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => a.remove(), 0);
  }

  /* ============ 卡片状态切换 ============ */
  function resetCard(item) {
    const card = item.card;
    const thumb = card.querySelector('.thumb');
    const img = card.querySelector('img');
    const btn = card.querySelector('.save');
    const hint = card.querySelector('.zoom-hint');
    const num = card.querySelector('.num');

    card.classList.remove('failed', 'done');
    thumb.classList.remove('clickable');
    img.classList.remove('ready');
    img.removeAttribute('src');

    let ph = thumb.querySelector('.placeholder');
    if (!ph) {
      ph = document.createElement('div');
      thumb.insertBefore(ph, thumb.firstChild);
    }
    ph.className = 'placeholder';
    ph.innerHTML = '<span class="spinner"></span>';

    btn.disabled = true;
    btn.textContent = '保存';
    hint.textContent = '点击放大';
    num.textContent = 'P' + item.page;
  }

  /* ============ 请求方法一：fetch（能拿 blob） ============ */
  async function tryFetch(url, signal, timeoutMs) {
    const ctl = new AbortController();
    const relay = () => ctl.abort();
    if (signal) {
      if (signal.aborted) return { cancelled: true };
      signal.addEventListener('abort', relay, { once: true });
    }
    let timedOut = false;
    const tid = timeoutMs > 0
      ? setTimeout(() => { timedOut = true; ctl.abort(); }, timeoutMs)
      : null;

    try {
      const res = await fetch(url, {
        signal: ctl.signal,
        mode: 'cors',
        credentials: 'omit'
      });

      if (res.status === 403) {
        const rawText = await res.text().catch(() => '');
        addLog('error', url, 'HTTP 403 Forbidden', rawText || roughText(rawText));
        return { serverKind: 'forbidden', errorText: roughText(rawText) };
      }
      if (res.status === 404) {
        const rawText = await res.text().catch(() => '');
        addLog('error', url, 'HTTP 404 Not Found', rawText || roughText(rawText));
        return { serverKind: 'notfound', errorText: roughText(rawText) };
      }
      if (!res.ok) {
        const rawText = await res.text().catch(() => '');
        addLog('error', url, 'HTTP ' + res.status, rawText || roughText(rawText));
        return { serverKind: 'http:' + res.status, errorText: roughText(rawText) };
      }

      const b = await res.blob();
      if (!b.size) {
        addLog('error', url, '空响应', '响应体大小为 0');
        return { serverKind: 'notfound', errorText: '' };
      }

      if (!b.type || !b.type.startsWith('image/')) {
        let rawText = '';
        try { rawText = await b.text(); } catch (e) {}
        addLog('error', url, '非图片响应 · ' + (b.type || 'unknown'), rawText || roughText(rawText));
        return { serverKind: 'notimage', errorText: roughText(rawText) };
      }

      addLog('info', url, '成功 · ' + (b.type || 'image') + ' · ' + formatSize(b.size), '');
      return { blob: b };
    } catch (err) {
      if (signal && signal.aborted) return { cancelled: true };
      return { fetchError: timedOut ? 'timeout' : 'network', errorText: '' };
    } finally {
      if (tid) clearTimeout(tid);
      if (signal) signal.removeEventListener('abort', relay);
    }
  }

  /* ============ 请求方法二：img 标签（能显示但拿不到 blob） ============ */
  function loadViaImgTag(imgEl, url, signal, timeoutMs) {
    return new Promise(resolve => {
      let settled = false;
      let timeoutId = null;
      let abortHandler = null;

      const finish = (result) => {
        if (settled) return;
        settled = true;
        if (timeoutId) { clearTimeout(timeoutId); timeoutId = null; }
        if (abortHandler && signal) signal.removeEventListener('abort', abortHandler);
        imgEl.onload = imgEl.onerror = null;
        resolve(result);
      };

      imgEl.onload = () => {
        if (imgEl.naturalWidth === 0) finish('error');
        else finish('ok');
      };
      imgEl.onerror = () => finish('error');

      if (signal) {
        if (signal.aborted) { finish('cancelled'); return; }
        abortHandler = () => {
          imgEl.removeAttribute('src');
          finish('cancelled');
        };
        signal.addEventListener('abort', abortHandler, { once: true });
      }

      if (timeoutMs > 0) {
        timeoutId = setTimeout(() => {
          imgEl.removeAttribute('src');
          finish('timeout');
        }, timeoutMs);
      }

      imgEl.src = url;
    });
  }

  /* ============ 失败卡片 ============ */
  function showErrorCard(card, page, url, kind, errorText) {
    card.classList.remove('done');
    card.classList.add('failed');

    let ph = card.querySelector('.placeholder');
    if (!ph) {
      const thumb = card.querySelector('.thumb');
      ph = document.createElement('div');
      thumb.insertBefore(ph, thumb.firstChild);
    }

    ph.className = 'placeholder err';
    ph.innerHTML =
      '<div class="x-mark">×</div>' +
      '<div class="x-text">' + escapeHtml(errTag(kind)) + ' · 点击重试</div>';

    card.querySelector('.zoom-hint').textContent = '点击重试';
    card.querySelector('.num').textContent = 'P' + page;
    card.querySelector('.save').disabled = true;

    return {
      page, url, failed: true, kind,
      errorText: errorText || '',
      blob: null, objectUrl: null, size: 0, imgOnly: false
    };
  }

  /* ============ 图片加载（核心：三阶段） ============ */
  async function loadIntoCard(item, pid, signal, timeoutMs, sourceTemplate) {
    const card = item.card;
    const page = item.page;
    const candidates = buildUrlCandidates(pid, page, sourceTemplate);
    const img  = card.querySelector('img');
    const btn  = card.querySelector('.save');
    const hint = card.querySelector('.zoom-hint');
    const num  = card.querySelector('.num');

    let lastUrl = candidates[0];
    let lastFetched = null;

    /* ---------- 阶段一：fetch 逐候选尝试（能拿到 blob） ---------- */
    for (let ci = 0; ci < candidates.length; ci++) {
      const url = candidates[ci];
      lastUrl = url;
      if (signal && signal.aborted) return null;

      const fetched = await tryFetch(url, signal, timeoutMs);
      if (fetched.cancelled) return null;
      if (signal && signal.aborted) return null;

      if (fetched.blob) {
        const objectUrl = URL.createObjectURL(fetched.blob);
        const ok = await new Promise(resolve => {
          img.onload  = () => { img.classList.add('ready'); resolve(true); };
          img.onerror = () => resolve(false);
          img.src = objectUrl;
        });
        if (signal && signal.aborted) { URL.revokeObjectURL(objectUrl); return null; }
        if (!ok) {
          URL.revokeObjectURL(objectUrl);
          addLog('error', url, '图片解码失败', 'blob 无法作为图片加载');
          lastFetched = { fetchError: 'network', errorText: '图片解码失败' };
          continue;
        }
        const ph = card.querySelector('.placeholder');
        if (ph) ph.remove();
        card.classList.remove('failed');
        card.classList.add('done');
        card.querySelector('.thumb').classList.add('clickable');
        hint.textContent = '点击放大';
        btn.disabled = false;
        btn.textContent = '保存';
        num.textContent = 'P' + page + ' · ' + formatSize(fetched.blob.size);
        return {
          page, url, blob: fetched.blob, objectUrl,
          size: fetched.blob.size, failed: false, imgOnly: false
        };
      }

      // 服务器明确错误 或 fetch 抛错，都记录，继续尝试下一候选
      lastFetched = fetched;
    }

    if (signal && signal.aborted) return null;

    /* ---------- 阶段二：fetch 全失败，用 img 标签兜底 ---------- */
    for (let ci = 0; ci < candidates.length; ci++) {
      const url = candidates[ci];
      lastUrl = url;
      if (signal && signal.aborted) return null;

      const tagResult = await loadViaImgTag(img, url, signal, timeoutMs);
      if (tagResult === 'cancelled') return null;
      if (signal && signal.aborted) return null;

      if (tagResult === 'ok') {
        // 图片存在（img 不受 CORS 限制能加载），但无法读取为 blob
        const ph = card.querySelector('.placeholder');
        if (ph) ph.remove();
        img.classList.add('ready');
        card.classList.remove('failed');
        card.classList.add('done');
        card.querySelector('.thumb').classList.add('clickable');
        hint.textContent = '点击放大（预览）';
        btn.disabled = false;
        btn.textContent = '打开原图';
        num.textContent = 'P' + page + ' · 预览模式（无法打包）';
        addLog('info', url,
          'img 标签加载成功（无 CORS，无法直下）',
          '图片存在且可显示，但服务器未返回 CORS 头，无法读取为 blob。' +
          '可通过「打开原图」手动另存，打包时会被跳过。');
        return {
          page, url,
          blob: null,
          objectUrl: url,
          size: 0,
          failed: false,
          imgOnly: true
        };
      }
    }

    if (signal && signal.aborted) return null;

    /* ---------- 阶段三：两段都失败，分类报错 ---------- */
    let finalKind = 'network';
    if (lastFetched) {
      if (lastFetched.fetchError === 'timeout')        finalKind = 'timeout';
      else if (lastFetched.serverKind)                 finalKind = lastFetched.serverKind;
      else if (lastFetched.fetchError === 'network')   finalKind = 'network';
    }
    addLog('error', lastUrl, errTag(finalKind),
      'fetch 与 img 标签对全部候选 URL 均失败');
    return showErrorCard(card, page, lastUrl, finalKind,
      (lastFetched && lastFetched.errorText) || '');
  }

  /* ============ 失败重试 ============ */
  async function retryItem(item) {
    if (!session || item.retrying) return;
    if (!item.result || !item.result.failed) return;

    const token  = runToken;
    const signal = session.controller.signal;
    const pid    = session.pid;
    const timeoutMs = session.timeout || 0;
    const sourceTemplate = els.source.value;

    item.retrying = true;

    const old = item.result;
    if (old && old.objectUrl && old.objectUrl.startsWith('blob:')) {
      URL.revokeObjectURL(old.objectUrl);
    }
    item.result = null;

    resetCard(item);

    stats.done = Math.max(0, stats.done - 1);
    stats.fail = Math.max(0, stats.fail - 1);
    stats.active++;
    stats.activePages.add(item.page);
    renderStats();
    setStatus('正在重试 P' + item.page + ' …');

    const waitMs = getIntervalMs();
    if (waitMs > 0) {
      await sleep(waitMs);
      if (token !== runToken) { item.retrying = false; return; }
    }

    const res = await loadIntoCard(item, pid, signal, timeoutMs, sourceTemplate);

    item.retrying = false;
    if (token !== runToken) return;

    stats.active = Math.max(0, stats.active - 1);
    stats.activePages.delete(item.page);

    if (res) {
      item.result = res;
      if (res.failed) stats.fail++;
      else { stats.ok++; stats.bytes += res.size || 0; }
    }
    stats.done++;
    renderStats();
    updateSaveAllState();

    if (res && res.failed) {
      setStatus('P' + item.page + ' 重试失败（' + errTag(res.kind) + '），可再次点击重试');
    } else if (res && res.imgOnly) {
      setStatus('P' + item.page + ' 重试成功，但为预览模式（无 CORS 头，无法打包）');
    } else if (res) {
      setStatus('P' + item.page + ' 重试成功');
    }
  }

  /* ============ 主流程 ============ */
  async function startLoad() {
    const pid        = els.pid.value.trim();
    const start      = parseInt(els.start.value, 10);
    const end        = parseInt(els.end.value, 10);
    const conc       = parseInt(els.conc.value, 10);
    const timeoutSec = parseFloat(els.timeout.value);
    const sourceTemplate = els.source.value;
    const intervalMode   = els.intervalMode.value;

    if (!/^\d{1,12}$/.test(pid)) { setStatus('PID 必须是纯数字'); return; }
    if (!Number.isFinite(start) || !Number.isFinite(end) || start < 1 || end < start) {
      setStatus('页码范围不正确'); return;
    }
    const total = end - start + 1;
    if (total > MAX_PAGES) { setStatus('一次最多获取 ' + MAX_PAGES + ' 页'); return; }
    if (!Number.isFinite(conc) || conc < 1 || conc > MAX_CONCURRENCY) {
      setStatus('并发数需为 1–' + MAX_CONCURRENCY + ' 之间的整数'); return;
    }
    if (!Number.isFinite(timeoutSec) || timeoutSec < 0) {
      setStatus('超时需为不小于 0 的秒数（0 表示无限等待）'); return;
    }

    if (intervalMode === 'fixed') {
      const v = parseInt(els.intervalFixed.value, 10);
      if (!Number.isFinite(v) || v < 0 || v > MAX_INTERVAL_MS) {
        setStatus('固定间隔需为 0–' + MAX_INTERVAL_MS + ' 之间的毫秒数'); return;
      }
    } else if (intervalMode === 'random') {
      const lo = parseInt(els.intervalMin.value, 10);
      const hi = parseInt(els.intervalMax.value, 10);
      if (!Number.isFinite(lo) || !Number.isFinite(hi) || lo < 0 || hi < 0 || hi > MAX_INTERVAL_MS) {
        setStatus('随机间隔需为 0–' + MAX_INTERVAL_MS + ' 之间的毫秒数'); return;
      }
      if (hi < lo) { setStatus('随机间隔的最大值不能小于最小值'); return; }
    }

    const timeoutMs = timeoutSec > 0 ? Math.round(timeoutSec * 1000) : 0;

    clearAll(false);
    resetStats();

    const token = ++runToken;
    const controller = new AbortController();

    const items = [];
    const frag = document.createDocumentFragment();
    for (let p = start; p <= end; p++) {
      const item = { page: p, card: null, result: null, retrying: false };
      const card = createCard(p);
      card._item = item;
      item.card = card;
      frag.appendChild(card);
      items.push(item);
    }
    els.grid.appendChild(frag);
    els.empty.hidden = true;

    session = { pid, items, controller, token, timeout: timeoutMs };

    stats.total = total;
    stats.queue = total;
    renderStats();
    startTimer();

    els.load.disabled = true;
    els.saveAll.disabled = true;
    els.packAll.disabled = true;

    const cfgText =
      '并发 ' + conc +
      ' · 间隔 ' + describeInterval() +
      ' · 超时 ' + (timeoutMs ? timeoutSec + 's' : '无限');
    setStatus('正在获取 PID ' + pid + ' 的 P' + start + '–P' + end + ' …（' + cfgText + '）');

    const queue = items.slice();

    async function runner() {
      while (true) {
        if (token !== runToken) return;
        const item = queue.shift();
        if (!item) return;

        stats.active++;
        stats.queue = queue.length;
        stats.activePages.add(item.page);
        renderStats();

        const waitMs = getIntervalMs();
        if (waitMs > 0) {
          await sleep(waitMs);
          if (token !== runToken) return;
        }

        const res = await loadIntoCard(item, pid, controller.signal, timeoutMs, sourceTemplate);
        if (token !== runToken) return;

        stats.active--;
        stats.activePages.delete(item.page);

        if (res) {
          item.result = res;
          if (res.failed) stats.fail++;
          else { stats.ok++; stats.bytes += res.size || 0; }
        }
        stats.done++;
        stats.queue = queue.length;
        renderStats();
      }
    }

    await Promise.all(
      Array.from({ length: Math.min(conc, total) }, () => runner())
    );

    if (token !== runToken) return;

    stats.active = 0;
    stats.queue = 0;
    stats.activePages.clear();
    renderStats();
    freezeTimer();
    els.load.disabled = false;
    updateSaveAllState();

    // 统计预览模式数量
    const previewCount = items.filter(i => i.result && i.result.imgOnly).length;

    const secs = stats.startTime ? ((Date.now() - stats.startTime) / 1000).toFixed(1) : '0.0';
    let msg = '完成：共 ' + total + ' 张 · 成功 ' + stats.ok + ' · 失败 ' + stats.fail +
              ' · 耗时 ' + secs + 's';
    if (stats.bytes) msg += ' · 内存 ' + formatSize(stats.bytes);
    if (previewCount > 0) msg += '（其中 ' + previewCount + ' 张为预览模式，无法打包）';
    if (stats.fail > 0) msg += '（点击失败卡片可重试）';
    setStatus(msg);
  }

  /* ============ 全部保存 ============ */
  async function saveAll() {
    if (saving || packing) return;
    const list = (session ? session.items : [])
      .filter(i => i.result && !i.result.failed);
    if (!list.length) { setStatus('没有可保存的图片'); return; }

    saving = true;
    els.saveAll.disabled = true;
    els.packAll.disabled = true;
    els.load.disabled = true;

    let blobCount = 0, previewCount = 0;
    for (let i = 0; i < list.length; i++) {
      const r = list[i].result;
      triggerDownload(r);
      if (r.imgOnly) {
        previewCount++;
        setStatus('保存中… ' + (i + 1) + ' / ' + list.length + '（打开原图）');
        await sleep(500);
      } else if (r.blob) {
        blobCount++;
        setStatus('保存中… ' + (i + 1) + ' / ' + list.length);
        await sleep(300);
      }
    }

    saving = false;
    els.load.disabled = false;
    updateSaveAllState();
    setStatus(
      '已触发保存 ' + list.length + ' 张（直下 ' + blobCount +
      (previewCount ? '，打开原图 ' + previewCount + '（请手动另存）' : '') + '）'
    );
  }

  /* ============ 打包 ZIP ============ */
  async function packAll() {
    if (packing || saving) return;
    if (!session) { setStatus('没有可打包的任务'); return; }

    const allOk   = session.items.filter(i => i.result && !i.result.failed);
    const list    = allOk.filter(i => i.result.blob);
    const skipped = allOk.length - list.length;

    if (!list.length) {
      setStatus('没有可打包的图片' +
        (skipped ? '（' + skipped + ' 张为预览模式，请用「打开原图」手动保存）' : ''));
      return;
    }

    packing = true;
    els.packAll.disabled = true;
    els.saveAll.disabled = true;
    els.load.disabled = true;

    setStatus('正在创建 ZIP 压缩包… 0 / ' + list.length +
      (skipped ? '（跳过 ' + skipped + ' 张预览图）' : ''));
    const zip = new JSZip();
    const pid = session.pid;

    try {
      for (let i = 0; i < list.length; i++) {
        const item = list[i];
        const r = item.result;
        const ext = extFromBlobType(r.blob.type);
        const filename = pid + '-' + item.page + '.' + ext;
        zip.file(filename, r.blob);
        setStatus('正在创建 ZIP 压缩包… ' + (i + 1) + ' / ' + list.length +
          (skipped ? '（跳过 ' + skipped + ' 张预览图）' : ''));
        if (i % 5 === 0) await sleep(0);
      }

      setStatus('正在生成 ZIP 文件…');
      const blob = await zip.generateAsync({ type: 'blob' }, (metadata) => {
        const percent = metadata.percent.toFixed(0);
        setStatus('正在生成 ZIP… ' + percent + '%');
      });

      const zipName = pid + '.zip';
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = zipName;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        a.remove();
        URL.revokeObjectURL(url);
      }, 1000);

      setStatus('✅ 打包完成！已下载 ' + zipName + '（' + list.length + ' 张' +
        (skipped ? '，跳过 ' + skipped + ' 张预览图' : '') + '）');
    } catch (err) {
      console.error('打包失败:', err);
      setStatus('打包失败：' + (err.message || '未知错误'));
    } finally {
      packing = false;
      els.load.disabled = false;
      updateSaveAllState();
    }
  }

  /* ============ 清空 ============ */
  function clearAll(updateUI) {
    runToken++;
    if (session && session.controller) session.controller.abort();

    if (session) {
      for (const item of session.items) {
        const r = item.result;
        if (r && r.objectUrl && r.objectUrl.startsWith('blob:')) {
          URL.revokeObjectURL(r.objectUrl);
        }
      }
    }
    session = null;

    closeLightbox();
    stopTimer();

    els.grid.innerHTML = '';
    els.empty.hidden = false;
    els.saveAll.disabled = true;
    els.packAll.disabled = true;
    els.load.disabled = false;

    if (updateUI !== false) {
      resetStats();
      setStatus('已清空，内存已释放');
    }
  }

  /* ============ 全屏预览 ============ */
  function previewList() {
    if (!session) return [];
    return session.items.filter(i => i.result && !i.result.failed);
  }

  function openLightbox(item) {
    const list = previewList();
    const idx  = list.indexOf(item);
    if (idx < 0) return;

    lbList = list;
    lbIndex = idx;
    els.lb.hidden = false;
    document.body.style.overflow = 'hidden';
    showLightboxImage();
    els.lbClose.focus();
  }

  function showLightboxImage() {
    if (!lbList.length) return;
    lbIndex = (lbIndex + lbList.length) % lbList.length;

    const item = lbList[lbIndex];
    const r = item.result;

    els.lbImg.classList.remove('ready');
    els.lbImg.src = r.objectUrl;

    const bits = ['P' + item.page];
    if (r.imgOnly) bits.push('预览模式');
    else if (r.size > 0) bits.push(formatSize(r.size));
    els.lbCaption.textContent = bits.join(' · ');

    els.lbCounter.textContent = (lbIndex + 1) + ' / ' + lbList.length;
    els.lbPrev.disabled = lbList.length < 2;
    els.lbNext.disabled = lbList.length < 2;
  }

  function closeLightbox() {
    if (els.lb.hidden) return;
    els.lb.hidden = true;
    els.lbImg.removeAttribute('src');
    document.body.style.overflow = '';
    lbList = [];
  }

  function lbPrev() { if (lbList.length > 1) { lbIndex--; showLightboxImage(); } }
  function lbNext() { if (lbList.length > 1) { lbIndex++; showLightboxImage(); } }

  els.lbClose.addEventListener('click', closeLightbox);
  els.lbPrev.addEventListener('click', lbPrev);
  els.lbNext.addEventListener('click', lbNext);

  els.lbStage.addEventListener('click', e => {
    if (e.target === els.lbStage) closeLightbox();
  });

  els.lbSave.addEventListener('click', () => {
    const item = lbList[lbIndex];
    if (item && item.result && !item.result.failed) triggerDownload(item.result);
  });

  document.addEventListener('keydown', e => {
    if (els.lb.hidden) return;
    if (e.key === 'Escape')           { e.preventDefault(); closeLightbox(); }
    else if (e.key === 'ArrowLeft')   { e.preventDefault(); lbPrev(); }
    else if (e.key === 'ArrowRight')  { e.preventDefault(); lbNext(); }
  });

  /* ============ 可折叠参数框 ============ */
  els.paramToggle.addEventListener('click', () => {
    const collapsed = els.paramBox.classList.toggle('collapsed');
    els.paramToggleText.textContent = collapsed ? '展开 ▼' : '折叠 ▲';
  });

  /* ============ 事件绑定 ============ */
  els.load.addEventListener('click', startLoad);
  els.saveAll.addEventListener('click', saveAll);
  els.packAll.addEventListener('click', packAll);
  els.clear.addEventListener('click', () => clearAll(true));

  els.intervalMode.addEventListener('change', updateIntervalUI);

  [els.pid, els.start, els.end, els.conc, els.timeout,
   els.intervalFixed, els.intervalMin, els.intervalMax].forEach(el => {
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); startLoad(); }
    });
  });

  window.addEventListener('beforeunload', () => {
    if (session && session.controller) session.controller.abort();
  });

  /* ============ 初始化 ============ */
  updateIntervalUI();
  renderStats();
  renderLogs();
})();
</script>
</body>
</html>
